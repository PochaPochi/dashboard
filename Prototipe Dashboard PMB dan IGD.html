<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototipe Dashboard PMB dan IGD</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1b2333;--mu:#6b7280;--bd:#e2e6ef;--ac:#2563eb;--g:#16a34a;--w:#d97706;--r:#dc2626;--gb:#dcfce7;--wb:#fef3c7;--rb:#fee2e2;--n:#94a3b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--cd:#171e2e;--tx:#e8ecf5;--mu:#98a2b8;--bd:#283148;--ac:#6d9bff;--g:#4ade80;--w:#fbbf24;--r:#f87171;--gb:#12351f;--wb:#3a2f0d;--rb:#3d1717;--n:#64748b}}
:root[data-theme="dark"]{--bg:#0f1420;--cd:#171e2e;--tx:#e8ecf5;--mu:#98a2b8;--bd:#283148;--ac:#6d9bff;--g:#4ade80;--w:#fbbf24;--r:#f87171;--gb:#12351f;--wb:#3a2f0d;--rb:#3d1717;--n:#64748b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:0}h3{font-size:13.5px;margin:0 0 8px}small{color:var(--mu);font-weight:400}
.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.sub{color:var(--mu);font-size:12px}
.tabs{display:flex;gap:6px}.tb,.sg,.rs{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:6px 12px;border-radius:8px;cursor:pointer}
.tb.on,.sg.on{background:var(--ac);border-color:var(--ac);color:#fff}
.fl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 0 12px;font-size:12.5px}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx)}
.sgs{display:inline-flex;gap:4px;flex-wrap:wrap}.sg{padding:4px 10px;font-size:12.5px}
.kcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kc{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--n);border-radius:10px;padding:10px 12px}
.kc.g{border-left-color:var(--g)}.kc.w{border-left-color:var(--w)}.kc.r{border-left-color:var(--r)}
.kt{font-size:12px;color:var(--mu)}.kv{font-size:24px;font-weight:700;margin:2px 0}.ks{font-size:11.5px;color:var(--mu);margin-bottom:5px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.chip.g{background:var(--gb);color:var(--g)}.chip.w{background:var(--wb);color:var(--w)}.chip.r{background:var(--rb);color:var(--r)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-bottom:12px}
section{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;min-width:0}
.fr{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;border-radius:8px;padding:2px;border:1px solid transparent}
.fr.on,.gr.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.fb{background:var(--ac);color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;white-space:nowrap;overflow:hidden}.fr{max-width:100%}
.fb.g{background:var(--g)}.fb.w{background:var(--w)}.fb.r{background:var(--r)}.fx{font-size:12px;color:var(--mu);white-space:nowrap}
.gr{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;border-radius:8px;padding:3px;border:1px solid transparent}
.gl{width:112px;font-size:12px;flex:none}.gv{width:46px;text-align:right;font-size:12px;flex:none}
.gt{position:relative;flex:1;height:14px;background:var(--bd);border-radius:7px}.gt i{display:block;height:100%;border-radius:7px;background:var(--n)}
.gt i.g{background:var(--g)}.gt i.w{background:var(--w)}.gt i.r{background:var(--r)}.gt u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}
.al{margin:0 0 8px;padding-left:18px;font-size:12.5px}.al li{margin-bottom:4px}
.in{border:1px dashed var(--ac);border-radius:8px;padding:8px 10px;font-size:12.5px}
svg{width:100%;height:auto;display:block}.ax{fill:var(--mu);font-size:8px}.lb{fill:var(--tx);font-size:8px}
.b{fill:var(--n);cursor:pointer}.b.g{fill:var(--g)}.b.w{fill:var(--w)}.b.r{fill:var(--r)}.b.sel{stroke:var(--tx);stroke-width:1.6}
.tl{stroke:var(--tx);stroke-dasharray:3 3;stroke-width:1}.band{fill:var(--rb)}.cp{fill:none;stroke:var(--ac);stroke-width:2}
.la{fill:none;stroke:var(--ac);stroke-width:2}.lt{fill:none;stroke:var(--mu);stroke-width:1.6;stroke-dasharray:4 3}
#tip{position:fixed;display:none;z-index:9;background:#111827;color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;pointer-events:none;max-width:260px}
.nt{font-size:11.5px;color:var(--mu);margin-top:8px}
</style></head><body><div class="wrap">
<div class="hd"><div><h1>Prototipe Dashboard: PMB dan IGD</h1><div class="sub">Contoh interaktif untuk tugas Pertemuan 6. Data ilustrasi, bukan data riil.</div></div>
<div class="tabs"><button class="tb" data-act="tab:pmb" id="t1">PMB (Tactical)</button><button class="tb" data-act="tab:igd" id="t2">IGD (Operational)</button></div></div>
<div id="app"></div><div id="tip"></div></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString("id-ID"),f1=n=>n.toFixed(1).replace(".",","),sg=n=>(n>0?"+":n<0?"−":"")+f1(Math.abs(n));
const NM={g:"On target",w:"Warning",r:"Critical"},hi=(v,g,w)=>v>=g?"g":v>=w?"w":"r",lo=(v,g,w)=>v<=g?"g":v<=w?"w":"r";
const chip=k=>`<span class="chip ${k}">${NM[k]}</span>`;
const card=(t,v,s,k)=>`<div class="kc ${k}"><div class="kt">${t}</div><div class="kv">${v}</div><div class="ks">${s}</div>${chip(k)}</div>`;
const opts=(a,c)=>`<option value="-1">Semua</option>`+a.map((n,i)=>`<option value="${i}"${c==i?" selected":""}>${n}</option>`).join("");
const seg=(act,a,c)=>`<span class="sgs"><button class="sg${c<0?" on":""}" data-act="${act}:-1">Semua</button>`+a.map((n,i)=>`<button class="sg${c==i?" on":""}" data-act="${act}:${c==i?-1:i}">${n}</button>`).join("")+`</span>`;
let tab="pmb",pf=-1,cf=-1,ss=2,sh=-1,tr=-1,hr=-1;
const PR=["Informatika","Sistem Informasi","Manajemen","Akuntansi"],CH=["Organic search","Media sosial","Iklan berbayar","Referral sekolah"];
const PS=[.32,.26,.24,.18],CT=[.32,.24,.24,.20],SLA=[90,74,76,90];
const SN=["Visitor","Account","Application complete","Accepted","Re-registration"],OWN=["","Marketing","Admisi + IT","Admisi","Admisi + Keuangan"];
const ACT=["","evaluasi kualitas traffic dan landing page","reminder otomatis, form lebih ringkas, respons lebih cepat","percepat seleksi dan komunikasi hasil","follow-up pelamar accepted, pengingat deadline, opsi cicilan"];
const TH={2:[75,70],4:[85,75]},SC=[0,35,100,100,100];
const D=[[0,0,2400,583,435,353,277],[0,1,2240,435,265,207,150],[0,2,2160,357,182,137,91],[0,3,1200,303,238,198,159],[1,0,1950,488,353,287,211],[1,1,1820,364,215,168,114],[1,2,1755,299,148,111,70],[1,3,975,254,193,161,122],[2,0,1800,424,326,265,216],[2,1,1680,317,199,156,118],[2,2,1620,260,137,103,71],[2,3,900,221,179,149,124],[3,0,1350,328,245,199,159],[3,1,1260,245,149,117,86],[3,2,1215,201,102,77,52],[3,3,675,171,134,112,92]];
function pmb(){
 const R=D.filter(r=>(pf<0||r[0]==pf)&&(cf<0||r[1]==cf)),S=i=>R.reduce((s,r)=>s+r[2+i],0);
 const T=R.reduce((s,r)=>s+2500*PS[r[0]]*CT[r[1]],0),e=S(4),ac=R.reduce((s,r)=>s+r[3],0),sla=R.reduce((s,r)=>s+r[3]*SLA[r[1]],0)/ac;
 const cards=card("New Student Enrollment",fmt(e),`Target ${fmt(T)} · ${sg((e-T)/T*100)}%`,hi(e/T,1,.9))
  +card("Conversion visitor → enroll",f1(e/S(0)*100)+"%","Target 10%",hi(e/S(0)*100,10,8))
  +card("Application complete rate",f1(S(2)/S(1)*100)+"%","Target 75%",hi(S(2)/S(1)*100,75,70))
  +card("Accepted → re-register",f1(S(4)/S(3)*100)+"%","Target 85% (usulan)",hi(S(4)/S(3)*100,85,75))
  +card("Inquiry SLA",f1(sla)+"%","Target 95%",hi(sla,95,80));
 const mx=S(0),fun=SN.map((n,i)=>{const v=S(i),x=i?v/S(i-1)*100:0,k=TH[i]?hi(x,...TH[i]):"n";
  return `<div class="fr${ss==i?" on":""}" data-act="ss:${i}" data-tip="${n}: ${fmt(v)}${i?` (${f1(x)}% dari ${SN[i-1]})`:""}"><div class="fb ${k}" style="width:${40+Math.sqrt(v/mx)*60}%">${n} ${fmt(v)}</div>${i?`<span class="fx">${f1(x)}%</span>`:""}</div>`}).join("");
 const st=rs=>{const a=rs.reduce((s,r)=>s+r[1+ss],0),b=rs.reduce((s,r)=>s+r[2+ss],0);return[a,b,b/a*100]};
 const grp=(names,key,cur,act)=>names.map((n,k)=>{const rs=D.filter(r=>r[key]==k&&(key?(pf<0||r[0]==pf):(cf<0||r[1]==cf))),[a,b,x]=st(rs),kk=TH[ss]?hi(x,...TH[ss]):"n";
  return `<div class="gr${cur==k?" on":""}" data-act="${act}:${cur==k?-1:k}" data-tip="${n}: ${fmt(b)} dari ${fmt(a)} (${f1(x)}%)"><span class="gl">${n}</span><div class="gt"><i class="${kk}" style="width:${x/SC[ss]*100}%"></i>${TH[ss]?`<u style="left:${TH[ss][0]/SC[ss]*100}%"></u>`:""}</div><span class="gv">${f1(x)}%</span></div>`}).join("");
 const rows=R.map(r=>({n:PR[r[0]]+" · "+CH[r[1]],a:r[1+ss],b:r[2+ss],x:r[2+ss]/r[1+ss]*100})).sort((p,q)=>p.x-q.x).slice(0,6);
 const AP=[.12,.27,.43,.6,.76,.89,.97,1],TP=[.1,.22,.35,.49,.63,.77,.9,1],ym=Math.max(T,e)*1.05,px=i=>30+i*320/7,py=v=>125-v/ym*115;
 const l1=AP.map((p,i)=>px(i)+","+py(e*p)).join(" "),l2=TP.map((p,i)=>px(i)+","+py(T*p)).join(" ");
 const dots=AP.map((p,i)=>`<circle cx="${px(i)}" cy="${py(e*p)}" r="5" fill="var(--ac)" data-tip="Minggu ${i+1}: aktual ${fmt(e*p)} vs target ${fmt(T*TP[i])}"/>`).join("");
 const xs=AP.map((p,i)=>`<text class="ax" x="${px(i)}" y="140" text-anchor="middle">M${i+1}</text>`).join("");
 const w0=rows[0],al=[`<b>${w0.n}</b>: konversi ${SN[ss]} ${f1(w0.x)}%. Owner: ${OWN[ss]}`];
 CH.forEach((c,k)=>{if((cf<0||cf==k)&&SLA[k]<80)al.push(`<b>Inquiry SLA ${c}</b> ${SLA[k]}% (target 95%). Owner: Koordinator PMB`)});
 if(e/T<.9)al.push(`<b>Enrollment</b> ${f1(e/T*100)}% dari target. Owner: Kepala PMB`);
 const cs=CH.map((c,k)=>({c,x:st(D.filter(r=>r[1]==k&&(pf<0||r[0]==pf)))[2]})).sort((p,q)=>p.x-q.x),av=st(D.filter(r=>pf<0||r[0]==pf))[2];
 return `<div class="fl"><label>Prodi <select data-sel="pf">${opts(PR,pf)}</select></label><label>Channel <select data-sel="cf">${opts(CH,cf)}</select></label><button class="rs" data-act="rs:0">Reset</button><span class="sub">Klik tahap funnel atau batang untuk drill-down dan cross-filter</span></div>
 <div class="kcs">${cards}</div>
 <div class="g2"><section><h3>Funnel PMB <small>klik tahap</small></h3>${fun}</section>
 <section><h3>Registrasi ulang kumulatif vs target pace</h3><svg viewBox="0 0 360 148"><line x1="30" x2="350" y1="125" y2="125" stroke="var(--bd)"/><polyline class="lt" points="${l2}"/><polyline class="la" points="${l1}"/>${dots}${xs}<text class="lb" x="32" y="14">Garis solid: aktual · putus-putus: target</text></svg></section></div>
 <div class="g2"><section><h3>${SN[ss-1]} → ${SN[ss]} per channel</h3>${grp(CH,1,cf,"cf")}<div class="nt">${TH[ss]?"Garis hitam = target.":"Tahap ini belum punya target."}</div></section>
 <section><h3>${SN[ss-1]} → ${SN[ss]} per prodi</h3>${grp(PR,0,pf,"pf")}</section></div>
 <div class="g2"><section><h3>Drill-down: sel terlemah <small>${SN[ss]}</small></h3><table><tr><th>Prodi · channel</th><th>Masuk</th><th>Lolos</th><th>Konversi</th><th>Status</th></tr>${rows.map(o=>`<tr><td>${o.n}</td><td>${fmt(o.a)}</td><td>${fmt(o.b)}</td><td>${f1(o.x)}%</td><td>${TH[ss]?chip(hi(o.x,...TH[ss])):"-"}</td></tr>`).join("")}</table></section>
 <section><h3>Exceptions dan insight</h3><ul class="al">${al.map(t=>`<li>${t}</li>`).join("")}</ul><div class="in"><b>Insight:</b> tahap ${SN[ss]} paling lemah di ${cs[0].c} (${f1(cs[0].x)}% vs rata-rata ${f1(av)}%). <b>Possible action:</b> ${ACT[ss]}.</div></section></div>
 <div class="nt">Catatan: enrollment dihitung sebagai registrasi ulang (2.112). Definisi KPI perlu dikunci di semantic layer. Refresh: harian; response time per jam.</div>`}
const AR=[6,5,4,3,3,4,7,12,18,22,24,23,21,20,19,20,24,30,34,36,33,27,18,10],WT=[14,12,10,9,9,11,15,20,26,30,32,31,31,31,30,38,46,64,76,84,80,70,48,28];
const BOR=[70,68,66,65,65,66,70,75,80,84,86,86,85,85,86,88,90,93,95,96,95,92,88,80],SH=h=>h>=7&&h<14?0:h>=14&&h<21?1:2;
const NUR=[8,7,5],TS=["Merah","Kuning","Hijau"],SHARE=[.08,.42,.5],MUL=[.13,.79,1.31],SHN=["Pagi","Sore","Malam"],cap=h=>NUR[SH(h)]*3.2;
const arr=(h,t)=>t<0?AR[h]:AR[h]*SHARE[t],wt=(h,t)=>t<0?WT[h]:WT[h]*MUL[t];
function igd(){
 const hs=hr>=0?[hr]:[...Array(24).keys()].filter(h=>sh<0||SH(h)==sh),sum=f=>hs.reduce((s,h)=>s+f(h),0),A=sum(h=>arr(h,tr));
 const aw=sum(h=>arr(h,tr)*wt(h,tr))/A,ok=sum(h=>arr(h,tr)*(1-Math.exp(-30/wt(h,tr))))/A*100,ld=sum(h=>AR[h])/sum(cap)*100,bo=sum(h=>BOR[h])/hs.length;
 const sc=hr>=0?`jam ${hr}.00`:sh<0?"seluruh hari":"shift "+SHN[sh].toLowerCase();
 const cards=card("Waktu tunggu rata-rata",fmt(aw)+" mnt",`Target ≤ 30 · ${sg(aw-30)} mnt · ${sc}`,lo(aw,30,40))
  +card("Dilayani ≤ 30 menit",fmt(ok)+"%","Target ≥ 90%",hi(ok,90,75))
  +card("Beban vs kapasitas",fmt(ld)+"%","Hijau < 80%, kritis > 100%",lo(ld,79.9,100))
  +card("Bed occupancy",fmt(bo)+"%","Hijau < 75%, kritis > 90%",lo(bo,74.9,90))
  +card("Kepuasan pasien","72%","Target ≥ 85% (ilustrasi)","r");
 const bw=440/24;let c1=`<rect class="band" x="${30+17*bw}" y="8" width="${5*bw}" height="127"/><text class="lb" x="${30+17*bw+3}" y="18">jam sibuk</text><line class="tl" x1="30" x2="470" y1="99" y2="99"/><text class="ax" x="2" y="102">30 mnt</text>`,c2="",cp="";
 for(let h=0;h<24;h++){const v=wt(h,tr),k=lo(v,30,40),o=sh<0||SH(h)==sh?1:.25,ht=v/100*120,a=AR[h]/45*120;
  c1+=`<rect class="b ${k}${hr==h?" sel":""}" x="${30+h*bw+1.5}" y="${135-ht}" width="${bw-3}" height="${ht}" opacity="${o}" data-act="hr:${hr==h?-1:h}" data-tip="${h}.00: tunggu ${fmt(v)} mnt, ${fmt(arr(h,tr))} pasien. Klik untuk drill-down"/>`;
  c2+=`<rect class="b ${AR[h]>cap(h)?"r":""}${hr==h?" sel":""}" x="${30+h*bw+1.5}" y="${135-a}" width="${bw-3}" height="${a}" opacity="${o}" data-act="hr:${hr==h?-1:h}" data-tip="${h}.00: ${AR[h]} pasien vs kapasitas ${fmt(cap(h))}/jam (${NUR[SH(h)]} perawat, ${[3,2,2][SH(h)]} dokter), BOR ${BOR[h]}%"/>`;
  cp+=`${30+h*bw},${135-cap(h)/45*120} ${30+(h+1)*bw},${135-cap(h)/45*120} `;
  if(h%3==0){const t=`<text class="ax" x="${30+h*bw+bw/2}" y="147" text-anchor="middle">${h}</text>`;c1+=t;c2+=t}}
 const ta=t=>{const a=sum(h=>AR[h]*SHARE[t]);return[a,sum(h=>AR[h]*SHARE[t]*WT[h]*MUL[t])/a]};
 const tri=TS.map((n,t)=>{const[a,w]=ta(t);return `<div class="gr${tr==t?" on":""}" data-act="tr:${tr==t?-1:t}" data-tip="${n}: ${fmt(a)} pasien, tunggu ${fmt(w)} mnt"><span class="gl">${n} (${SHARE[t]*100}%)</span><div class="gt"><i class="${lo(w,30,40)}" style="width:${Math.min(100,w/100*100)}%"></i><u style="left:30%"></u></div><span class="gv">${fmt(w)} mnt</span></div>`}).join("");
 const rg=a=>`${Math.min(...a)}.00–${Math.max(...a)+1}.00`,cr=hs.filter(h=>wt(h,tr)>40),ov=hs.filter(h=>AR[h]>cap(h)),bd=hs.filter(h=>BOR[h]>90),al=[];
 if(cr.length)al.push(`<b>Waktu tunggu > 40 mnt</b> pada ${rg(cr)}. Owner: Kepala shift IGD`);
 if(ov.length)al.push(`<b>Pasien/jam melebihi kapasitas</b> pada ${rg(ov)}. Owner: Kepala shift, Manajer Keperawatan`);
 if(bd.length)al.push(`<b>BOR > 90%</b> pada ${rg(bd)}. Owner: Bed management`);
 al.push(`<b>Kepuasan 72%</b> di bawah target 85%. Owner: Humas/CS`);
 const pk=hs.reduce((a,h)=>wt(h,tr)>wt(a,tr)?h:a,hs[0]);
 const pl=h=>{let s=h*7919+13;const r=()=>(s=s*16807%2147483647)/2147483647,o=[];for(let i=0;i<14;i++){const u=r(),t=tr>=0?tr:u<.08?0:u<.5?1:2,w=Math.round(wt(h,t)*(.6+r()*.9)),id="P-"+(1000+Math.floor(r()*9000));if(w>30)o.push({id,t:TS[t],w})}return o.sort((a,b)=>b.w-a.w).slice(0,8)};
 const dd=hr>=0?`<table><tr><th>ID (anonim)</th><th>Triase</th><th>Menunggu</th><th>Status</th></tr>${pl(hr).map(p=>`<tr><td>${p.id}</td><td>${p.t}</td><td>${p.w} mnt</td><td>${chip(p.w>60?"r":"w")} ${p.w>60?"Eskalasi":"Pantau"}</td></tr>`).join("")||`<tr><td colspan="4">Tidak ada pasien menunggu > 30 mnt</td></tr>`}</table><div class="nt">Daftar dummy untuk ilustrasi drill-down jam ${hr}.00.</div>`:`<div class="sub">Klik salah satu batang jam pada grafik untuk melihat daftar pasien yang menunggu lebih dari 30 menit.</div>`;
 return `<div class="fl"><label>Shift ${seg("sh",SHN,sh)}</label><label>Triase ${seg("tr",TS,tr)}</label><button class="rs" data-act="rs:0">Reset</button></div>
 <div class="kcs">${cards}</div>
 <div class="g2"><section><h3>Waktu tunggu per jam <small>klik batang = cross-filter + drill-down</small></h3><svg viewBox="0 0 480 152">${c1}</svg></section>
 <section><h3>Pasien per jam vs kapasitas shift <small>garis = kapasitas</small></h3><svg viewBox="0 0 480 152">${c2}<polyline class="cp" points="${cp}"/></svg></section></div>
 <div class="g2"><section><h3>Triase: waktu tunggu <small>klik = filter · garis = 30 mnt</small></h3>${tri}</section>
 <section><h3>Exceptions <small>${sc}</small></h3><ul class="al">${al.map(t=>`<li>${t}</li>`).join("")}</ul><div class="in"><b>Insight:</b> puncak tunggu ${fmt(wt(pk,tr))} mnt pada jam ${pk}.00, beban ${fmt(AR[pk]/cap(pk)*100)}% kapasitas, BOR ${BOR[pk]}%. Hipotesis: arrival rate melampaui kapasitas shift ${SHN[SH(pk)].toLowerCase()}. <b>Possible action:</b> ${AR[pk]>cap(pk)?"tambah perawat (floating), jalur fast-track triase hijau":"pertahankan staffing"}${BOR[pk]>90?", percepat discharge/transfer untuk membebaskan bed":""}.</div></section></div>
 <div class="g2"><section style="grid-column:1/-1"><h3>Drill-down pasien menunggu</h3>${dd}</section></div>
 <div class="nt">Refresh panel operasional: 5–15 menit. Triase merah ditandai segera ditangani.</div>`}
function draw(){$("#app").innerHTML=tab=="pmb"?pmb():igd();$("#t1").classList.toggle("on",tab=="pmb");$("#t2").classList.toggle("on",tab=="igd")}
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const[k,v]=a.dataset.act.split(":"),n=+v;
 if(k=="tab")tab=v;else if(k=="pf")pf=n;else if(k=="cf")cf=n;else if(k=="ss")ss=n;else if(k=="sh"){sh=n;hr=-1}else if(k=="tr")tr=n;else if(k=="hr")hr=n;else if(k=="rs"){pf=cf=sh=tr=hr=-1;ss=2}
 draw()});
document.addEventListener("change",e=>{const s=e.target.dataset.sel;if(!s)return;if(s=="pf")pf=+e.target.value;else cf=+e.target.value;draw()});
const tp=$("#tip");document.addEventListener("pointermove",e=>{const t=e.target.closest("[data-tip]");if(!t){tp.style.display="none";return}tp.textContent=t.dataset.tip;tp.style.display="block";tp.style.left=Math.max(4,Math.min(e.clientX+12,innerWidth-tp.offsetWidth-8))+"px";tp.style.top=(e.clientY+14)+"px"});
draw();
</script></body></html>
